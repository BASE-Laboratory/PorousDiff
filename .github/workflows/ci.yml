name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax, Slurm & End-to-End Pytest Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: ${{ matrix.python-version }}

      - name: Install CPU PyTorch and PorousDiff test dependencies
        run: |
          uv venv --clear .venv
          uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Validate Python syntax across package, scripts, and tests
        run: .venv/bin/python -m compileall -q porousdiff scripts tests

      - name: Run Ruff static lint checks
        run: .venv/bin/ruff check porousdiff scripts tests --select E9,F63,F7,F82,F401

      - name: Validate Slurm batch script syntax
        run: bash -n slurm/*.slurm

      - name: Run unit, conditioning convergence, and 5-stage end-to-end CLI pipeline tests
        run: .venv/bin/pytest -v
